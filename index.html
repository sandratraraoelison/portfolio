<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#193e33" />
    <meta name="description" content="Portfolio de Sandratra Raoelison, développeur Fullstack JavaScript et TypeScript à Antananarivo." />
    <title>Portfolio | Sandratra Raoelison</title>
    <script>
      // Appliquer le thème avant que React ne se monte pour éviter le flash blanc
      (function () {
        const saved = localStorage.getItem("theme");
        const theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
        if (theme === "dark") {
          document.documentElement.style.backgroundColor = "#111827";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
